<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles & Ynah's Guestlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .guest-card { transition: transform 0.1s; }
    .guest-card:hover { transform: scale(1.02); }
  </style>
</head>
<body class="bg-stone-100 min-h-screen font-sans text-stone-800 p-4 sm:p-8">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-stone-900">Charles & Ynah's Guestlist</h1>
        <p class="text-stone-500 text-sm mt-1" id="stats-subtitle">Loading stats...</p>
      </div>
      <div class="flex gap-2">
        <button onclick="exportData()" class="px-4 py-2 bg-white border border-stone-300 rounded shadow-sm hover:bg-stone-50 text-sm font-medium">📥 Export JSON</button>
        <label class="px-4 py-2 bg-white border border-stone-300 rounded shadow-sm hover:bg-stone-50 text-sm font-medium cursor-pointer">
          📤 Import JSON
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </header>

    <!-- Add Guest Form -->
    <div class="bg-white p-4 rounded-lg shadow-sm mb-8 border border-stone-200">
      <form id="add-guest-form" onsubmit="addGuest(event)" class="flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider">Guest Name</label>
          <input type="text" id="guest-name" required class="w-full px-3 py-2 border border-stone-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="w-full sm:w-auto">
          <label class="block text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider">Side</label>
          <select id="guest-side" class="w-full px-3 py-2 border border-stone-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Charles">Charles</option>
            <option value="Ynah">Ynah</option>
            <option value="Both">Both</option>
          </select>
        </div>
        <div class="w-full sm:w-auto">
          <label class="block text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider">Tier</label>
          <select id="guest-tier" class="w-full px-3 py-2 border border-stone-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="A">A-List (Priority)</option>
            <option value="B">B-List (If budget/space)</option>
            <option value="C">C-List (Optional)</option>
          </select>
        </div>
        <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-stone-900 text-white font-medium rounded shadow hover:bg-stone-800 transition-colors">
          Add Guest
        </button>
      </form>
    </div>

    <!-- Board -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- A List -->
      <div class="flex flex-col bg-emerald-50 rounded-lg p-4 border border-emerald-200">
        <div class="mb-4 flex justify-between items-center">
          <div>
            <h2 class="font-bold text-lg text-emerald-800">A-List</h2>
            <p class="text-xs text-emerald-600">The Non-negotiables</p>
          </div>
          <span id="count-A" class="bg-emerald-200 text-emerald-900 text-xs font-bold px-2 py-1 rounded-full">0</span>
        </div>
        <div id="tier-A" class="flex-1 flex flex-col gap-3 min-h-[100px]"></div>
      </div>

      <!-- B List -->
      <div class="flex flex-col bg-amber-50 rounded-lg p-4 border border-amber-200">
        <div class="mb-4 flex justify-between items-center">
          <div>
            <h2 class="font-bold text-lg text-amber-800">B-List</h2>
            <p class="text-xs text-amber-600">If space/budget allows</p>
          </div>
          <span id="count-B" class="bg-amber-200 text-amber-900 text-xs font-bold px-2 py-1 rounded-full">0</span>
        </div>
        <div id="tier-B" class="flex-1 flex flex-col gap-3 min-h-[100px]"></div>
      </div>

      <!-- C List -->
      <div class="flex flex-col bg-stone-200/50 rounded-lg p-4 border border-stone-200">
        <div class="mb-4 flex justify-between items-center">
          <div>
            <h2 class="font-bold text-lg text-stone-600">C-List</h2>
            <p class="text-xs text-stone-500">Only if abundant space</p>
          </div>
          <span id="count-C" class="bg-stone-300 text-stone-800 text-xs font-bold px-2 py-1 rounded-full">0</span>
        </div>
        <div id="tier-C" class="flex-1 flex flex-col gap-3 min-h-[100px]"></div>
      </div>

    </div>
  </div>

  <script>
    const initialGuests = [
      { id: '1', name: 'Charlie', side: 'Charles', tier: 'A' },
      { id: '2', name: 'Mama', side: 'Charles', tier: 'A' },
      { id: '3', name: 'Papa', side: 'Charles', tier: 'A' },
      { id: '4', name: 'Karla', side: 'Charles', tier: 'A' },
      { id: '5', name: 'Meeko', side: 'Charles', tier: 'A' },
      { id: '6', name: 'Justine', side: 'Charles', tier: 'A' },
      { id: '7', name: 'Dave', side: 'Charles', tier: 'A' },
      { id: '8', name: 'Rey', side: 'Charles', tier: 'A' },
      { id: '9', name: 'Marco', side: 'Charles', tier: 'A' },
      { id: '10', name: 'Joshua', side: 'Charles', tier: 'A' },
      { id: '11', name: 'Diego', side: 'Charles', tier: 'A' },
      { id: '12', name: 'CDO', side: 'Charles', tier: 'A' },
      { id: '13', name: 'Sandra', side: 'Charles', tier: 'A' },
      { id: '14', name: 'Jonelle', side: 'Charles', tier: 'A' },
      { id: '15', name: 'Juvene', side: 'Charles', tier: 'A' },
      { id: '16', name: 'Lhuigi (HS friends)', side: 'Charles', tier: 'A' },
      { id: '17', name: 'Felix (HS friends)', side: 'Charles', tier: 'A' },
      { id: '18', name: 'By', side: 'Charles', tier: 'A' },
      { id: '19', name: 'Jian', side: 'Charles', tier: 'A' },
      { id: '20', name: 'Jed', side: 'Charles', tier: 'A' },
      { id: '21', name: 'Josiah', side: 'Charles', tier: 'A' },
      { id: '22', name: 'Ate Jessa', side: 'Charles', tier: 'A' },
      { id: '23', name: 'Ivan', side: 'Charles', tier: 'A' },
      { id: '24', name: 'Rhanz', side: 'Charles', tier: 'A' },
      { id: '25', name: 'Kuya Renz', side: 'Ynah', tier: 'A' },
      { id: '26', name: 'Ninang Ate Doray', side: 'Ynah', tier: 'A' },
      { id: '27', name: 'Jeric Orgasan', side: 'Ynah', tier: 'A' },
      { id: '28', name: 'Doris Orgasan', side: 'Ynah', tier: 'A' },
      { id: '29', name: 'Gerry Orgasan', side: 'Ynah', tier: 'A' },
      { id: '30', name: 'Renz Vidal', side: 'Ynah', tier: 'A' },
      { id: '31', name: 'Jeryll Orgasan (MOH)', side: 'Ynah', tier: 'A' },
      { id: '32', name: 'Mae Orgasan (MOH)', side: 'Ynah', tier: 'A' },
      { id: '33', name: 'Pat Adlawan (Flowers)', side: 'Ynah', tier: 'A' },
      { id: '34', name: 'Charm', side: 'Ynah', tier: 'A' },
      { id: '35', name: 'Yamsie', side: 'Ynah', tier: 'A' },
      { id: '36', name: 'Wemby (Host)', side: 'Ynah', tier: 'A' },
      { id: '37', name: 'Gigi', side: 'Ynah', tier: 'A' },
      { id: '38', name: 'Pocholo', side: 'Ynah', tier: 'A' },
      { id: '39', name: 'Chloe', side: 'Ynah', tier: 'A' },
      { id: '40', name: 'Jenica', side: 'Ynah', tier: 'A' },
      { id: '41', name: 'MJ', side: 'Ynah', tier: 'A' },
      { id: '42', name: 'Nichole Tolentino (Graphics Design)', side: 'Ynah', tier: 'A' },
      { id: '43', name: 'Jerald', side: 'Ynah', tier: 'A' },
      { id: '44', name: 'Princess', side: 'Ynah', tier: 'A' },
      { id: '45', name: 'Lorielle', side: 'Ynah', tier: 'A' },
      { id: '46', name: 'Ella', side: 'Ynah', tier: 'A' },
      { id: '47', name: 'Ivy (Souvenir)', side: 'Ynah', tier: 'A' },
      { id: '48', name: 'Jhon', side: 'Ynah', tier: 'A' },
      { id: '49', name: 'Laica', side: 'Ynah', tier: 'A' },
      { id: '50', name: 'Ate Rachel', side: 'Ynah', tier: 'A' },
      { id: '51', name: 'Irish (Architect)', side: 'Ynah', tier: 'A' },
      { id: '52', name: 'Yani', side: 'Ynah', tier: 'A' },
      { id: '53', name: 'Ate Keanna', side: 'Ynah', tier: 'A' },
      { id: '54', name: 'Trixie', side: 'Ynah', tier: 'A' },
      { id: '55', name: 'Danna', side: 'Ynah', tier: 'A' },
      { id: '56', name: 'Nicole', side: 'Ynah', tier: 'A' },
      { id: '57', name: 'Claude', side: 'Ynah', tier: 'A' },
      { id: '58', name: 'Casey', side: 'Ynah', tier: 'A' },
      { id: '59', name: 'Mei Mei (Drawing Artist)', side: 'Ynah', tier: 'A' },
      { id: '60', name: 'Ate Aya (Painting/Giveaway)', side: 'Both', tier: 'A' }
    ];

    let guests = [];

    function init() {
      const saved = localStorage.getItem('weddingGuestlist');
      if (saved) { guests = JSON.parse(saved); } 
      else { guests = [...initialGuests]; saveData(); }
      render();
    }

    function saveData() {
      localStorage.setItem('weddingGuestlist', JSON.stringify(guests));
    }

    function generateId() { return Math.random().toString(36).substr(2, 9); }

    function addGuest(e) {
      e.preventDefault();
      const name = document.getElementById('guest-name').value.trim();
      const side = document.getElementById('guest-side').value;
      const tier = document.getElementById('guest-tier').value;
      if (!name) return;
      guests.push({ id: generateId(), name, side, tier });
      saveData();
      render();
      document.getElementById('guest-name').value = '';
    }

    function removeGuest(id) {
      if(confirm('Remove this guest?')) {
        guests = guests.filter(g => g.id !== id);
        saveData();
        render();
      }
    }

    function changeTier(id, newTier) {
      const index = guests.findIndex(g => g.id === id);
      if (index > -1) {
        guests[index].tier = newTier;
        saveData();
        render();
      }
    }

    function getSideBadgeColor(side) {
      if (side === 'Charles') return 'bg-blue-100 text-blue-800';
      if (side === 'Ynah') return 'bg-pink-100 text-pink-800';
      return 'bg-purple-100 text-purple-800';
    }

    function render() {
      ['A', 'B', 'C'].forEach(tier => {
        const container = document.getElementById(`tier-${tier}`);
        container.innerHTML = '';
        
        const tierGuests = guests.filter(g => g.tier === tier);
        document.getElementById(`count-${tier}`).innerText = tierGuests.length;

        tierGuests.forEach(guest => {
          const card = document.createElement('div');
          card.className = "guest-card bg-white p-3 rounded shadow-sm border border-stone-200 flex justify-between items-center group";
          card.innerHTML = `
            <div>
              <div class="font-medium text-sm text-stone-800">${guest.name}</div>
              <span class="inline-block mt-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${getSideBadgeColor(guest.side)}">
                ${guest.side}
              </span>
            </div>
            <div class="flex flex-col gap-1 md:flex-row items-center opacity-0 group-hover:opacity-100 transition-opacity">
              <select onchange="changeTier('${guest.id}', this.value)" class="text-xs border border-stone-300 rounded bg-stone-50 py-1 px-1 focus:outline-none">
                <option value="A" ${guest.tier === 'A' ? 'selected' : ''}>Move: A</option>
                <option value="B" ${guest.tier === 'B' ? 'selected' : ''}>Move: B</option>
                <option value="C" ${guest.tier === 'C' ? 'selected' : ''}>Move: C</option>
              </select>
              <button onclick="removeGuest('${guest.id}')" class="text-red-500 hover:text-red-700 px-2 py-1 bg-red-50 rounded border border-red-100 text-xs">
                Delete
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      });

      // Update Stats
      document.getElementById('stats-subtitle').innerText = 
        `Total: ${guests.length} | Charles: ${guests.filter(g => g.side === 'Charles').length} | Ynah: ${guests.filter(g => g.side === 'Ynah').length} | Both: ${guests.filter(g => g.side === 'Both').length}`;
    }

    function exportData() {
      const dataStr = JSON.stringify(guests, null, 2);
      const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
      const link = document.createElement('a');
      link.setAttribute('href', dataUri);
      link.setAttribute('download', 'wedding_guestlist_data.json');
      link.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            guests = imported;
            saveData();
            render();
            alert('Data imported successfully!');
          } else { alert('Invalid file format.'); }
        } catch (err) { alert('Error parsing JSON.'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    window.onload = init;
  </script>
</body>
</html>
