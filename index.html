<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles & Ynah's Guestlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    body {
      background: #f5f5f4;
    }
    .guest-row { cursor: grab; }
    .guest-row:active { cursor: grabbing; }
    .sortable-ghost { opacity: 0.4; background: #fce7f3; }
    .sort-active { background: #292524; color: #fff; }
  </style>
</head>
<body class="min-h-screen font-sans text-stone-800 text-sm">

  <div class="max-w-5xl mx-auto p-3 sm:p-4">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <div>
        <h1 class="text-lg font-semibold text-stone-900">Charles & Ynah's Guestlist</h1>
        <p class="text-xs text-stone-500 mt-0.5">
          Total <span id="stat-total" class="font-medium text-stone-700">0</span>
          · Charles <span id="stat-charles" class="font-medium text-blue-700">0</span>
          · Ynah <span id="stat-ynah" class="font-medium text-pink-700">0</span>
          · Both <span id="stat-both" class="font-medium text-stone-700">0</span>
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <div class="flex items-center gap-0.5 border border-stone-300 rounded overflow-hidden bg-white">
          <span class="px-2 text-[10px] uppercase tracking-wide text-stone-400">Sort</span>
          <button type="button" id="sort-name" onclick="setSort('name')" class="px-2 py-1 text-xs hover:bg-stone-100 border-l border-stone-200">Name</button>
          <button type="button" id="sort-side" onclick="setSort('side')" class="px-2 py-1 text-xs hover:bg-stone-100 border-l border-stone-200">Side</button>
        </div>
        <button onclick="exportCSV()" class="px-2 py-1 bg-white border border-stone-300 rounded text-xs hover:bg-stone-50">CSV</button>
        <button onclick="exportData()" class="px-2 py-1 bg-white border border-stone-300 rounded text-xs hover:bg-stone-50">JSON</button>
        <label class="px-2 py-1 bg-white border border-stone-300 rounded text-xs hover:bg-stone-50 cursor-pointer">
          Import
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </header>

    <!-- Add Guest -->
    <form id="add-guest-form" onsubmit="addGuest(event)" class="flex flex-wrap gap-2 items-center mb-3 bg-white border border-stone-200 rounded p-2">
      <input type="text" id="guest-name" required placeholder="Guest name" class="flex-1 min-w-[140px] px-2 py-1.5 border border-stone-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-stone-400">
      <select id="guest-side" class="px-2 py-1.5 border border-stone-300 rounded text-sm bg-white">
        <option value="Charles">Charles</option>
        <option value="Ynah" selected>Ynah</option>
        <option value="Both">Both</option>
      </select>
      <select id="guest-tier" class="px-2 py-1.5 border border-stone-300 rounded text-sm bg-white">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
      <button type="submit" class="px-3 py-1.5 bg-stone-800 text-white text-sm rounded hover:bg-stone-900">Add</button>
    </form>

    <!-- Board -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
      <section class="bg-white border border-emerald-200 rounded">
        <div class="flex items-center justify-between px-2.5 py-1.5 border-b border-emerald-100 bg-emerald-50">
          <h2 class="font-semibold text-emerald-900 text-xs uppercase tracking-wide">A-List <span class="font-normal text-emerald-600 normal-case tracking-normal">· must invite</span></h2>
          <span id="count-A" class="text-xs font-semibold text-emerald-800">0</span>
        </div>
        <div id="tier-A" data-tier="A" class="flex flex-col min-h-[80px] p-1"></div>
      </section>

      <section class="bg-white border border-amber-200 rounded">
        <div class="flex items-center justify-between px-2.5 py-1.5 border-b border-amber-100 bg-amber-50">
          <h2 class="font-semibold text-amber-900 text-xs uppercase tracking-wide">B-List <span class="font-normal text-amber-600 normal-case tracking-normal">· if space</span></h2>
          <span id="count-B" class="text-xs font-semibold text-amber-800">0</span>
        </div>
        <div id="tier-B" data-tier="B" class="flex flex-col min-h-[80px] p-1"></div>
      </section>

      <section class="bg-white border border-stone-200 rounded">
        <div class="flex items-center justify-between px-2.5 py-1.5 border-b border-stone-100 bg-stone-50">
          <h2 class="font-semibold text-stone-700 text-xs uppercase tracking-wide">C-List <span class="font-normal text-stone-500 normal-case tracking-normal">· optional</span></h2>
          <span id="count-C" class="text-xs font-semibold text-stone-700">0</span>
        </div>
        <div id="tier-C" data-tier="C" class="flex flex-col min-h-[80px] p-1"></div>
      </section>
    </div>
  </div>

  <script>
    const SIDE_ORDER = { Charles: 0, Ynah: 1, Both: 2 };
    const initialGuests = [
      { id: '1', name: 'Charlie', side: 'Charles', tier: 'A' },
      { id: '2', name: 'Mama', side: 'Charles', tier: 'A' },
      { id: '25', name: 'Kuya Renz', side: 'Ynah', tier: 'A' },
      { id: '26', name: 'Ninang Ate Doray', side: 'Ynah', tier: 'A' },
      { id: '60', name: 'Ate Aya (Painting/Giveaway)', side: 'Both', tier: 'A' }
    ];

    let guests = [];
    let sortMode = localStorage.getItem('weddingGuestlistSort') || 'name';
    let sortables = [];

    function init() {
      const saved = localStorage.getItem('weddingGuestlist');
      if (saved) {
        guests = JSON.parse(saved);
      } else {
        guests = [...initialGuests];
        saveData();
      }
      applySort();
      render();
      initDragAndDrop();
      updateSortButtons();
    }

    function initDragAndDrop() {
      sortables.forEach(s => s.destroy());
      sortables = [];
      ['A', 'B', 'C'].forEach(tier => {
        const el = document.getElementById(`tier-${tier}`);
        sortables.push(new Sortable(el, {
          group: 'shared',
          animation: 120,
          ghostClass: 'sortable-ghost',
          onEnd: syncOrderFromDom
        }));
      });
    }

    function syncOrderFromDom() {
      const next = [];
      ['A', 'B', 'C'].forEach(tier => {
        const container = document.getElementById(`tier-${tier}`);
        [...container.children].forEach(row => {
          const id = row.getAttribute('data-id');
          const guest = guests.find(g => g.id === id);
          if (guest) {
            guest.tier = tier;
            next.push(guest);
          }
        });
      });
      guests = next;
      saveData();
      updateCounts();
      updateStats();
    }

    function saveData() {
      localStorage.setItem('weddingGuestlist', JSON.stringify(guests));
    }

    function generateId() {
      return Math.random().toString(36).substr(2, 9);
    }

    function setSort(mode) {
      if (sortMode === mode && mode === 'name') {
        sortMode = 'name-desc';
      } else if (sortMode === 'name-desc' && mode === 'name') {
        sortMode = 'name';
      } else {
        sortMode = mode;
      }
      localStorage.setItem('weddingGuestlistSort', sortMode);
      applySort();
      saveData();
      render();
      updateSortButtons();
    }

    function applySort() {
      guests.sort((a, b) => {
        if (a.tier !== b.tier) return a.tier.localeCompare(b.tier);
        if (sortMode === 'side') {
          const sideCmp = (SIDE_ORDER[a.side] ?? 9) - (SIDE_ORDER[b.side] ?? 9);
          if (sideCmp !== 0) return sideCmp;
          return a.name.localeCompare(b.name);
        }
        if (sortMode === 'name-desc') return b.name.localeCompare(a.name);
        return a.name.localeCompare(b.name);
      });
    }

    function updateSortButtons() {
      const nameBtn = document.getElementById('sort-name');
      const sideBtn = document.getElementById('sort-side');
      nameBtn.classList.toggle('sort-active', sortMode === 'name' || sortMode === 'name-desc');
      sideBtn.classList.toggle('sort-active', sortMode === 'side');
      nameBtn.textContent = sortMode === 'name-desc' ? 'Name ↓' : 'Name';
    }

    function addGuest(e) {
      e.preventDefault();
      const name = document.getElementById('guest-name').value.trim();
      const side = document.getElementById('guest-side').value;
      const tier = document.getElementById('guest-tier').value;
      if (!name) return;
      guests.push({ id: generateId(), name, side, tier });
      applySort();
      saveData();
      render();
      document.getElementById('guest-name').value = '';
      document.getElementById('guest-name').focus();
    }

    function removeGuest(id) {
      if (!confirm('Remove this guest?')) return;
      guests = guests.filter(g => g.id !== id);
      saveData();
      render();
    }

    function getSideBadgeColor(side) {
      if (side === 'Charles') return 'bg-blue-50 text-blue-700';
      if (side === 'Ynah') return 'bg-pink-50 text-pink-700';
      return 'bg-stone-100 text-stone-600';
    }

    function updateCounts() {
      ['A', 'B', 'C'].forEach(tier => {
        document.getElementById(`count-${tier}`).innerText =
          guests.filter(g => g.tier === tier).length;
      });
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = guests.length;
      document.getElementById('stat-charles').innerText = guests.filter(g => g.side === 'Charles').length;
      document.getElementById('stat-ynah').innerText = guests.filter(g => g.side === 'Ynah').length;
      document.getElementById('stat-both').innerText = guests.filter(g => g.side === 'Both').length;
    }

    function render() {
      ['A', 'B', 'C'].forEach(tier => {
        const container = document.getElementById(`tier-${tier}`);
        container.innerHTML = '';
        guests.filter(g => g.tier === tier).forEach(guest => {
          const row = document.createElement('div');
          row.className = 'guest-row flex items-center gap-2 px-1.5 py-1 rounded hover:bg-stone-50 group';
          row.setAttribute('data-id', guest.id);
          row.innerHTML = `
            <span class="flex-1 truncate text-stone-800 pointer-events-none">${guest.name}</span>
            <span class="shrink-0 text-[10px] font-medium px-1.5 py-0.5 rounded ${getSideBadgeColor(guest.side)} pointer-events-none">${guest.side}</span>
            <button onclick="removeGuest('${guest.id}')" class="shrink-0 text-stone-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100 px-1" title="Remove">×</button>
          `;
          container.appendChild(row);
        });
      });
      updateCounts();
      updateStats();
    }

    function exportData() {
      const dataStr = JSON.stringify(guests, null, 2);
      const link = document.createElement('a');
      link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
      link.download = 'wedding_guestlist_data.json';
      link.click();
    }

    function exportCSV() {
      if (guests.length === 0) return;
      const rows = [['Name', 'Side', 'Tier'].join(',')];
      guests.forEach(g => {
        rows.push([`"${g.name.replace(/"/g, '""')}"`, g.side, g.tier].join(','));
      });
      const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'wedding_guestlist.csv';
      link.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert('Invalid file format.');
            return;
          }
          guests = imported;
          applySort();
          saveData();
          render();
          alert('Data imported successfully!');
        } catch (err) {
          alert('Error parsing JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    window.onload = init;
  </script>
</body>
</html>
